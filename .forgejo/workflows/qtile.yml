---
name: "qtile"

on: ["push"]

jobs:
  config-check:
    runs-on: docker
    container:
      image: python:3.14-slim-trixie
    steps:
      - run: apt update && apt install -y nodejs libxcb1 libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0
      - uses: actions/checkout@v6
      - name: "Install qtile"
        run: pip install qtile==0.36.0
      - name: "Validate"
        run: qtile check --config ./window-managers/.config/qtile/config.py
