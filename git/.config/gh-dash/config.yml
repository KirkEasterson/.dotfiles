---
pager:
  diff: diffnav
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true

prSections:
  - title: Open
    filters: is:open
  - title: Created
    filters: is:open author:@me
  - title: Mentioned
    filters: is:open mentions:@me
  - title: Needs review
    filters: is:open review-requested:@me

issuesSections:
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me
  - title: Open
    filters: is:open

defaults:
  preview:
    open: true
    width: 0.5
  prsLimit: 20
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30

repoPaths:
  :owner/:repo: ~/dev/github.com/:owner/:repo

  # TODO: add bindings for using git-worktree
keybindings:
  issues: []
  prs:
    - key: i
      name: Review
      command: "tuicr pr {{.PrNumber}}"
    - key: I
      name: CI/CD
      command: "gh enhance -R {{.RepoName}} {{.PrNumber}}"
theme:
  ui:
    table:
      showSeparator: true
