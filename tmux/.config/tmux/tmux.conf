### SETTINGS ###

# change the prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# 256 colors
set -g default-terminal "tmux-256color"

# increase history limit
set-option -g history-limit 50000

# show messages for 4 seconds
set-option -g display-time 4000

# enable focus-events for terminals that support them
set-option -g focus-events on

# resize current window to smallest window attached to that session
set-window-option -g aggressive-resize on

# update wayland vars
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK XDG_CURRENT_DESKTOP"

# move status bar to the top
# set -g status-position top

# don't detach from tmux when session is destroyed
set-option -g detach-on-destroy off

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# automatically renumber windows to always be in sequential order
set -g renumber-windows

# pass xterm-style key sequences
set -gw xterm-keys on
set -s extended-keys on

# no delay when hitting escape
set -s escape-time 0

# don't start login shells
set -g default-command "$SHELL"

# allow passthrough for yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# source tmux conf
bind-key r source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf"

# no bells
# set -g bell-action none

# don't rename windows automatically
set -g allow-rename off

# vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# turn the mouse on
set -g mouse on
# disable copy on mouse-drag in copy-mode
unbind -T copy-mode-vi MouseDragEnd1Pane
# disable mouse scrolling actions on the status bar
unbind-key -T root WheelUpStatus
unbind-key -T root WheelDownStatus

# true color settings
set -ag terminal-overrides ",xterm-256color*:Tc"

# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# setting title
set -g set-titles on
set -g set-titles-string '#S: #W - TMUX'

# set clipboard (copy-command)
if-shell '[[ "$(uname -s)" == "Linux" ]] && ! grep -q Microsoft /proc/version 2>/dev/null' {
    # Check WAYLAND_DISPLAY first; fallback to X11 if empty
    if-shell '[[ -n "$WAYLAND_DISPLAY" ]]' {
        set -s copy-command 'wl-copy'
    } {
        set -s copy-command 'xclip -selection clipboard'
    }
}
if-shell '[[ "$(uname -s)" == "Darwin" ]]' {
    set -s copy-command 'pbcopy'
}
if-shell 'grep -q Microsoft /proc/version 2>/dev/null' {
    set -s copy-command 'clip.exe'
}

# don't exit copy mode when yanking
bind -T copy-mode-vi y send-keys -X copy-pipe

source-file "${HOME}/.config/tmux/theme.conf"

### SESSIONS ###

# sessionizer
bind C-f display-popup -T "REPOS" -x C -y S -w 100% -h 40% -E "tmux_sessionizer.sh"
bind C-o display-popup -T "SESSIONS" -x C -y S -w 100% -h 40% -E "tmux_sessions.sh"

# rename session
bind M-z command-prompt -I "rename-session "

