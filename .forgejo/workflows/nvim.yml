---
name: "nvim"

on: ["push"]

env:
  NVIM_BASE_DIR: "vim/.config/nvim"
  STYLUA_BASE_DIR: "formatters/.config/stylua"

jobs:
  stylua:
    runs-on: docker
    container:
      image: johnnymorganz/stylua:2.5.2
    steps:
      - uses: actions/checkout@v6
      - name: "Run stylua"
        run: stylua --allow-hidden --check -f ${{ env.STYLUA_BASE_DIR }}/stylua.toml ${{ env.NVIM_BASE_DIR }}
